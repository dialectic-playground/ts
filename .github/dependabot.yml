# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# One npm entry per implemented project (package.json + package-lock.json in the project directory).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (Node.js 24 (LTS); TypeScript via tsc as a project dependency) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /00-hello-world
    schedule:
      interval: weekly
    groups:
      npm-00-hello-world:
        patterns: ["*"]
    commit-message:
      prefix: build
    # typescript-eslint supports only TypeScript < 6.1, and @types/node follows the Node.js
    # release line (24); move either deliberately, together with what depends on it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
